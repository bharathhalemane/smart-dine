name: qr-order-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo-data:/data/db
    logging: *default-logging
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  app:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/qrorder?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 40s
    logging: *default-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

  # ---- optional: start with  docker compose -f docker-compose.prod.yml --profile monitoring up -d ----
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest      # pin a version once you have tested it
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"          # reachable from the server itself only (use an SSH tunnel)
    depends_on:
      - app
    logging: *default-logging

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:latest  # pin a version once you have tested it
    restart: unless-stopped
    volumes:
      - ./ops/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"          # reachable from the server itself only; first login admin/admin forces a new password
    depends_on:
      - prometheus
    logging: *default-logging

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data: