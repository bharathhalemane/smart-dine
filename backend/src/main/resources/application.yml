spring:
  application:
    name: qr-order-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/qrorder?replicaSet=rs0&directConnection=true}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: qr-order
    access-token-ttl: 15m
  refresh:
    ttl: 7d
    cookie-secure: true
    cookie-same-site: Strict

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.example.qrorder: INFO
  pattern:
    level: "%5p [trace=%X{traceId:-}]"

---
spring:
  config:
    activate:
      on-profile: dev

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
  refresh:
    cookie-secure: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.example.qrorder: DEBUG