spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: qr-order-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/qrorder?replicaSet=rs0&directConnection=true}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      health:
        mail:
          enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: qr-order
    access-token-ttl: 15m
  refresh:
    ttl: 7d
    cookie-secure: true
    cookie-same-site: Strict
  mail:
    from: ${APP_FROM_EMAIL:no-reply@qrorder.local}
  verification:
    ttl: 24h
    resend-cooldown: 60s
    link-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  password-reset:
    ttl: 1h
    resend-cooldown: 60s
    link-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}
  invitation:
    ttl: 7d
    link-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  qr:
    customer-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.example.qrorder: INFO
  pattern:
    level: "%5p [trace=%X{traceId:-}]"

---
spring:
  config:
    activate:
      on-profile: dev

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
  refresh:
    cookie-secure: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.example.qrorder: DEBUG