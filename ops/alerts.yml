groups:
  - name: qr-order
    rules:
      - alert: AppDown
        expr: up{job="qr-order"} == 0
        for: 2m
        annotations:
          summary: "The app cannot be scraped (down or unreachable) for 2 minutes"

      - alert: HighServerErrorRate
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        annotations:
          summary: "More than 5% of requests are failing with a server error"

      - alert: SlowRequests
        expr: >
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        annotations:
          summary: "95th percentile request time has been over 1 second for 10 minutes"

      - alert: HeldOrdersPiling
        expr: qrorder_orders_awaiting_payment > 50
        for: 15m
        annotations:
          summary: "Many held orders are waiting for payment"